<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buzzer Club</title>
<meta name="description" content="A live quiz for friends. Join with the link your host sent.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23E8483B' stroke='%231B1F3B' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" data-link><span class="buzz" aria-hidden="true"></span>Buzzer Club</a>
    <span id="conn" class="conn" role="status" hidden>Reconnecting…</span>
  </header>
  <div id="notice" class="notice warn" role="alert" hidden></div>
  <main id="app"></main>
  <footer class="foot">
    <span>Each question scores up to 1000 points. Faster correct answers score more.</span>
    <a href="/builder" data-link>Quiz builder</a>
  </footer>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
